# JVM: reducido de 8G→4G heap y de 4G→512m Metaspace.
# Con 15GB RAM el modo Zero Based Compressed Oops colocaba el heap en 24GB,
# bloqueando el native heap (arena.cpp:191 OOM tras 287s de compilación K2/FIR).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0

# Limitar workers evita los 230 hilos simultáneos que saturaban el nativo
org.gradle.workers.max=4

# Reutilizar el daemon entre builds para evitar cold-start OOM
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# Configuración
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Deshabilitar snapshot incremental de classpath del compilador K2:
# reduce presión de memoria en el análisis FIR (NonLocalDeclarationUtils OOM)
kotlin.incremental.useClasspathSnapshot=false
