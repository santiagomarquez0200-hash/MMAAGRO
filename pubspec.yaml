name: agro_aplicaciones
description: "AgriControl - APK offline-first para operadores de campo"
publish_to: 'none'

version: 1.0.1+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.5
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # Inyección de dependencias
  get_it: ^7.7.0

  # Red y API
  dio: ^5.4.3
  logger: ^2.0.2+1
  connectivity_plus: ^6.0.3

  # Base de datos local (Drift)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Seguridad
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # UI / Navegación
  go_router: ^13.2.4
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  shimmer: ^3.0.0

  # Cámara / Imágenes
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3

  # Variables de entorno
  flutter_dotenv: ^5.2.1

  # Utilidades
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  device_info_plus: ^10.1.0
  dartz: ^0.10.1
  google_fonts: ^8.0.2
  package_info_plus: ^8.3.0
  pdf: 3.10.8
  printing: ^5.12.0
  share_plus: ^12.0.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Gráficas
  fl_chart: ^0.69.0

  # CSV / Excel export
  csv: ^6.0.0
  excel: ^4.0.6

  # Firma digital
  signature: ^5.5.0

  # GPS / Localización
  geolocator: ^13.0.1
  # Solo para requestService(): el diálogo nativo que enciende la ubicación sin
  # salir de la app (geolocator no lo expone). No se usa para rastrear.
  location: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icons/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
